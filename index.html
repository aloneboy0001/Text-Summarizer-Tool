<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer Tool</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Text Summarizer Tool</h1>
        <div class="mb-3">
            <textarea id="summarizer-input" class="form-control" rows="10" placeholder="Enter text to summarize"></textarea>
        </div>
        <div class="d-grid">
            <button id="summarize-btn" class="btn btn-primary">Summarize</button>
        </div>
        <div id="summarizer-result" class="mt-4 alert alert-secondary d-none"></div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Set your API key
        function setApiKey() {
            return "your_api_key"; // Replace with your API key
        }

        // Function to generate summarized content using Gemini API
        function generateResponseWithGemini(prompt) {
            const apiKey = setApiKey();
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`;

            const headers = new Headers({
                'Content-Type': 'application/json',
            });

            const body = JSON.stringify({
                'contents': [{
                    'parts': [{
                        'text': prompt
                    }]
                }]
            });

            const options = {
                method: 'POST',
                headers: headers,
                body: body
            };

            const resultDiv = document.getElementById('summarizer-result');
            resultDiv.classList.remove('d-none', 'alert-success', 'alert-danger');
            resultDiv.classList.add('alert-secondary');
            resultDiv.textContent = 'Summarizing...';

            fetch(apiUrl, options)
                .then(response => response.json())
                .then(data => {
                    const content = data.candidates && data.candidates[0] && data.candidates[0].content
                        ? data.candidates[0].content.parts[0].text
                        : 'Error: Could not summarize the text.';
                    resultDiv.classList.remove('alert-secondary');
                    resultDiv.classList.add('alert-success');
                    resultDiv.textContent = content;
                })
                .catch(error => {
                    resultDiv.classList.remove('alert-secondary');
                    resultDiv.classList.add('alert-danger');
                    resultDiv.textContent = `Error: ${error.message}`;
                });
        }

        // Event listener for summarize button
        document.getElementById('summarize-btn').addEventListener('click', () => {
            const input = document.getElementById('summarizer-input').value.trim();
            if (input) {
                const prompt = `Summarize the following text: ${input}`;
                generateResponseWithGemini(prompt);
            } else {
                const resultDiv = document.getElementById('summarizer-result');
                resultDiv.classList.remove('d-none', 'alert-success', 'alert-secondary');
                resultDiv.classList.add('alert-danger');
                resultDiv.textContent = 'Please enter some text to summarize.';
            }
        });
    </script>
</body>
</html>
